import groovy.json.JsonOutput

// Read resolved release dependencies without modifying the Android build.
gradle.projectsEvaluated {
    def app = gradle.rootProject.findProject(':app')
    app.tasks.register('exportReleaseDependencyInventory') {
        doLast {
            def artifacts = app.configurations.getByName('releaseRuntimeClasspath').resolvedConfiguration.resolvedArtifacts.collect {
                [group: it.moduleVersion.id.group, name: it.moduleVersion.id.name,
                 version: it.moduleVersion.id.version, file: it.file.absolutePath]
            }.sort { "${it.group}:${it.name}:${it.version}" }
            def output = new File(gradle.rootProject.projectDir, '../scratch/android-release-dependencies.json')
            output.parentFile.mkdirs()
            output.text = JsonOutput.prettyPrint(JsonOutput.toJson(artifacts)) + '\n'
            println "ANDROID_RELEASE_DEPENDENCIES=${artifacts.size()}"
        }
    }
}
