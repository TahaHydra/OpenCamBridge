[package]
name = "rust-frame-producer"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
image = "0.24"
# SIMD-accelerated resize for the 1080p portrait->landscape letterbox path
# (the measured producer bottleneck). Pure Rust + SIMD, no C toolchain. Used
# with a runtime fallback to image::imageops::resize, and can be disabled at
# runtime with OCB_DISABLE_SIMD_RESIZE.
fast_image_resize = "5"
# Faster JPEG decode for the MJPEG path (the `image` crate's decoder is the next
# bottleneck after resize, ~9-13ms at 1080p). zune-jpeg is PURE RUST (no C
# toolchain — unlike turbojpeg, which needs cmake+nasm on PATH), and is used with
# a runtime fallback to image::load_from_memory and an OCB_DISABLE_FASTJPEG kill
# switch.
zune-jpeg = "0.4"
reqwest = { version = "0.11", features = ["blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Software fallback for systems where the Media Foundation/D3D11 decoder cannot
# run. The primary H.264 decoder is implemented in mf_decoder.rs.
openh264 = "0.6"
windows = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Performance",
    "Win32_Media_MediaFoundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_Com"
] }
